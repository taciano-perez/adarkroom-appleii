FEATURES {
    STARTADDRESS: default = $0803;
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0800; # 2k stack
    __HIMEM__:     type = weak, value = $9600; # DOS 3.3
    __LCADDR__:    type = weak, value = $D400; # Language Card
    __LCSIZE__:    type = weak, value = $0C00;
    __LC_START__:  type = weak, value = $D400; 
    __LC_LAST__:   type = weak, value = $D400;
}

MEMORY {
    ZP:     file = "", define = yes, start = $0080, size = $001A;
    RAM:    file = %O, define = yes, start = %S,    size = __HIMEM__ - %S;
}

SEGMENTS {
    ZEROPAGE: load = ZP,             type = zp;
    STARTUP:  load = RAM,            type = ro;
    LOWCODE:  load = RAM,            type = ro,  optional = yes;
    CODE:     load = RAM,            type = ro;
    RODATA:   load = RAM,            type = ro;
    DATA:     load = RAM,            type = rw;
    INIT:     load = RAM,            type = rw,  optional = yes;
    ONCE:     load = RAM,            type = ro,  define   = yes, optional = yes;
    BSS:      load = RAM,            type = bss, define   = yes;
}